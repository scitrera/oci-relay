name: Test (Python)

on:
  push:
    branches: [ main, develop-next ]
  pull_request:
    branches: [ main, develop-next ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-sparkrun-oci-relay-plugin:
    name: Test sparkrun-oci-relay-plugin (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Lint with ruff
        run: |
          pip install ruff==0.15.6
          ruff check .
        working-directory: .

      - name: Install
        run: pip install --no-deps -e . && pip install "pytest>=8"
        working-directory: .

      - name: Run tests
        run: python -m pytest -q
        working-directory: .
