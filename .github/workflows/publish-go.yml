# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (Go)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-go.yml

  verify-tag:
    name: Verify tag matches oci-relay version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify versions are in sync
        run: uvx --from 'git+https://github.com/scitrera/repo-tools.git@898be3f3408a0da7d5dee81d8752c06d2ac7bf23' sync-versions --check --verbose

      - name: Compare tag against versions.yaml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(uvx --from 'git+https://github.com/scitrera/repo-tools.git@898be3f3408a0da7d5dee81d8752c06d2ac7bf23' sync-versions --print-version oci-relay)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the oci-relay version declared in versions.yaml ($declared)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."

  build-oci-relay:
    name: Build oci-relay (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: [ tests, verify-tag ]
    strategy:
      # One unsupported target must not withhold the assets for every other
      # platform; the release job needs what did build.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
          cache-dependency-path: ./go.sum


      - name: Check native build prerequisites
        run: |
          python3 --version && cc --version && make --version
        working-directory: .

      - name: Configure macOS loopback for multi-link tests
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2
        working-directory: .

      - name: Test Go on the native target
        run: |
          go test -race -count=1 ./...
        working-directory: .
      - name: Build
        working-directory: .
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # A dispatch run has no tag to read a version from, and must still
          # produce something identifiable rather than an asset called "".
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          COMMIT="$GITHUB_SHA"
          bin="oci-relay"
          if [ "$GOOS" = windows ]; then bin="$bin.exe"; fi
          stage="$RUNNER_TEMP/stage-oci-relay"
          rm -rf "$stage"
          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w -buildid= -X github.com/scitrera/oci-relay/internal/buildinfo.Version=$VERSION -X github.com/scitrera/oci-relay/internal/buildinfo.Commit=$COMMIT" -o "$stage/$bin" ./cmd/oci-relay
          cp "$GITHUB_WORKSPACE/LICENSE" "$stage/"
          cp "$GITHUB_WORKSPACE/LICENSE_EXCEPTION" "$stage/"
          cp "$GITHUB_WORKSPACE/COPYRIGHT" "$stage/"
          cp "$GITHUB_WORKSPACE/README.md" "$stage/"
          cp "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$stage/"
          cp "$GITHUB_WORKSPACE/THIRD_PARTY_LICENSES.txt" "$stage/"
          export BUNDLE_DIR="$stage" VERSION GOOS GOARCH
          python3 scripts/build-decoder.py
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          base="oci-relay_${VERSION}_${GOOS}_${GOARCH}"
          case "$GOOS" in
            windows) (cd "$stage" && zip -qr "$dist/$base.zip" .) ;;
            *) tar -czf "$dist/$base.tar.gz" -C "$stage" . ;;
          esac
          ls -l "$dist"

      - name: Upload oci-relay (${{ matrix.goos }}/${{ matrix.goarch }})
        uses: actions/upload-artifact@v7
        with:
          name: binaries-oci-relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          # An empty upload here would surface as a release that is simply
          # missing a platform, which nobody notices until someone downloads it.
          if-no-files-found: error

  github-release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: [ build-oci-relay ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: Checksums
        run: |
          set -euo pipefail
          # Written outside dist/ first: `sha256sum ./* > dist/checksums.txt`
          # truncates the file before the glob expands, so it would list itself.
          (cd dist && sha256sum ./*) > checksums.txt
          mv checksums.txt dist/
          cat dist/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
