# Canonical release versions and generated GitHub CI configuration.
oci-relay: 0.1.3
sparkrun-oci-relay-plugin: 0.1.3

go_toolchain:
  go: "1.26.9"

project_rules:
  oci-relay:
    - {type: gomod, path: go.mod}
    - {type: go_version, path: internal/buildinfo/buildinfo.go}
  sparkrun-oci-relay-plugin:
    - {type: pyproject, path: pyproject.toml}
    - {type: init_py, path: plugin/src/sparkrun_oci_relay/__init__.py}

preferred_versions:
  python:
    ruff: "0.15.6"

ci:
  repo_tools_source: "git+https://github.com/scitrera/repo-tools.git@898be3f3408a0da7d5dee81d8752c06d2ac7bf23"
  check_generated_ci: true
  test_branches: [main, develop-next]
  only_workflows: [version-check, test-go, test-python, publish-go]
  github_release: true
  go:
    go_version: "1.26.9"
    lint: none
    enable_govulncheck: true
    govulncheck_version: "v1.3.0"
    test_args: "-race -count=1"
    verify_tag_version: oci-relay
    setup_steps:
      - name: Check Go formatting
        run: 'test -z "$(gofmt -l cmd internal)"'
    extra_steps:
      - name: Check redistributed dependency licenses
        run: 'python3 scripts/dependency-licenses.py --check'
    binary_platforms: [linux/amd64, linux/arm64, darwin/arm64]
    binaries:
      - name: oci-relay
        project: oci-relay
        package: ./cmd/oci-relay
        ldflags: "-s -w -buildid= -X github.com/scitrera/oci-relay/internal/buildinfo.Version=$VERSION -X github.com/scitrera/oci-relay/internal/buildinfo.Commit=$COMMIT"
        platform_runners:
          linux/amd64: ubuntu-24.04
          linux/arm64: ubuntu-24.04-arm
          darwin/arm64: macos-15
        setup_steps:
          - name: Check native build prerequisites
            run: python3 --version && cc --version && make --version
          - name: Configure macOS loopback for multi-link tests
            if: runner.os == 'macOS'
            run: sudo ifconfig lo0 alias 127.0.0.2
          - name: Test Go on the native target
            run: go test -race -count=1 ./...
        package_command: python3 scripts/build-decoder.py
        extra_files: [LICENSE, COPYRIGHT, README.md, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.txt]
  python:
    test_versions: ["3.12", "3.13"]
    lint: ruff
    # Core 0.4.0 is being developed alongside this project. Unit tests do not
    # import it; opt-in integration tests use its develop-next checkout.
    install: 'pip install --no-deps -e . && pip install "pytest>=8"'
    test_command: 'python -m pytest -q'
